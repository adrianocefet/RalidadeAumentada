<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Controlador Virtual</title>
  <!-- Cliente MQTT para navegador via WebSockets (Paho) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.1.0/paho-mqtt.min.js" integrity="sha512-dwqv8+1S9m0b3fQHqQ2d4oKG4kFMZJkz6NUI0YF0t4X6H+y9qH7dO0eWZKqPpV1s+0m7z1sZsFKR6tKpQK2yVw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <style>
    :root{--bg:#0b1020;--ink:#e6eefb;--muted:#9fb2d1;--accent:#00e5ff;--ok:#34d399;--bad:#ef4444}
    *{box-sizing:border-box} html,body{height:100%}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);
      background:radial-gradient(1200px 600px at 50% -10%,rgba(0,229,255,.10),transparent 60%),
                 radial-gradient(1000px 500px at 100% 100%,rgba(0,229,255,.05),transparent 60%),var(--bg);
      display:grid;grid-template-rows:auto 1fr auto;gap:12px;padding:18px}
    header{display:flex;align-items:center;justify-content:space-between}
    .status{display:inline-flex;align-items:center;gap:8px;font-size:.95rem;color:var(--muted)}
    .dot{width:10px;height:10px;border-radius:999px;background:var(--bad);box-shadow:0 0 10px rgba(239,68,68,.6)}
    .dot.ok{background:var(--ok);box-shadow:0 0 10px rgba(52,211,153,.6)}
    .card{padding:16px;border:1px solid rgba(255,255,255,.08);border-radius:14px;background:rgba(255,255,255,.03);backdrop-filter:blur(6px)}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
    .grid .val{font-size:1.4rem;font-weight:700}
    button.primary{appearance:none;border:0;cursor:pointer;width:100%;padding:16px;border-radius:14px;font-weight:700;letter-spacing:.3px;color:#00131a;background:var(--accent);
      box-shadow:0 12px 28px rgba(0,229,255,.35),inset 0 -6px 20px rgba(0,0,0,.25);transition:transform .12s ease,filter .12s ease}
    button.primary:active{transform:translateY(1px) scale(.995);filter:brightness(.95)}
    .hint{color:var(--muted);font-size:.92rem}
    footer{color:var(--muted);font-size:.85rem;text-align:center;opacity:.9}
  </style>
</head>
<body>
  <header>
    <h2 style="margin:0;font-size:1.1rem">Controlador Virtual</h2>
    <div class="status"><span id="mqttDot" class="dot"></span><span id="mqttText">MQTT desconectado</span></div>
  </header>

  <section class="card">
    <div class="grid">
      <div><div class="val" id="alpha">0</div><div class="hint">alpha° (z)</div></div>
      <div><div class="val" id="beta">0</div><div class="hint">beta° (x)</div></div>
      <div><div class="val" id="gamma">0</div><div class="hint">gamma° (y)</div></div>
    </div>
  </section>

  <section class="card">
    <button id="btnAction" class="primary">Acionar animação</button>
    <p class="hint" id="permHint" style="margin-top:10px">Toque no botão para autorizar sensores, se solicitado pelo navegador.</p>
  </section>

  <footer>Transmitindo rotação do dispositivo e evento de ação via MQTT (WebSockets) para o broker público.</footer>

  <script>
    // ===========================
    // Configuração do MQTT (Paho)
    // ===========================
    // Broker público Mosquitto com WebSockets: portas 8080 (ws) e 8081 (wss).
    // Use WSS quando sua página estiver servida em HTTPS para evitar conteúdo misto.
    const MQTT_URL = 'wss://test.mosquitto.org:8081/mqtt'; // pode trocar por outro broker público
    const TOPIC_ORI = 'webxr/ar/plane1/orientation';
    const TOPIC_ACT = 'webxr/ar/plane1/action';

    const clientId = 'ctrl-' + Math.random().toString(16).slice(2);
    const client = new Paho.MQTT.Client(MQTT_URL, clientId);

    const dot = document.getElementById('mqttDot');
    const txt = document.getElementById('mqttText');

    client.onConnectionLost = () => { dot.classList.remove('ok'); txt.textContent = 'MQTT desconectado'; reconnect(); };

    function connect() {
      client.connect({
        timeout: 4,
        keepAliveInterval: 30,
        cleanSession: true,
        reconnect: true,
        onSuccess: () => { dot.classList.add('ok'); txt.textContent = 'MQTT conectado'; },
        onFailure: () => { dot.classList.remove('ok'); txt.textContent = 'Falha na conexão'; setTimeout(reconnect, 1000); }
      });
    }
    function reconnect(){ try{ connect(); }catch(e){} }
    connect();

    // ==========================================
    // Como o controle envia os dados
    // 1) Captura DeviceOrientationEvent (alpha,beta,gamma)
    // 2) Publica JSON nos tópicos MQTT a ~20 Hz
    // 3) No clique do botão, publica um sinal de ação
    let latest = { alpha:0, beta:0, gamma:0 };
    let streaming = false;

    function onOrientation(ev){
      latest.alpha = Number.isFinite(ev.alpha)? ev.alpha:0;
      latest.beta  = Number.isFinite(ev.beta)?  ev.beta:0;
      latest.gamma = Number.isFinite(ev.gamma)? ev.gamma:0;
      document.getElementById('alpha').textContent = latest.alpha.toFixed(0);
      document.getElementById('beta').textContent  = latest.beta.toFixed(0);
      document.getElementById('gamma').textContent = latest.gamma.toFixed(0);
    }

    async function ensureSensorPermission(){
      try{
        if(typeof DeviceOrientationEvent!== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function'){
          const state = await DeviceOrientationEvent.requestPermission();
          if(state !== 'granted'){ alert('Permita o acesso aos sensores para transmitir a rotação.'); return false; }
        }
        return true;
      }catch(e){ return true; }
    }

    function startStreaming(){
      if(streaming) return;
      window.addEventListener('deviceorientation', onOrientation, true);
      setInterval(() => {
        if(client.isConnected()){
          const msg = new Paho.MQTT.Message(JSON.stringify({type:'orientation', ...latest, t:Date.now()}));
          msg.destinationName = TOPIC_ORI;
          try{ client.send(msg); }catch(e){}
        }
      }, 50); // 20 Hz
      streaming = true;
      document.getElementById('permHint').textContent = 'Sensores ativos. Movimente o telefone para controlar o avião.';
    }

    document.getElementById('btnAction').addEventListener('click', async ()=>{
      const ok = await ensureSensorPermission();
      if(ok) startStreaming();
      if(client.isConnected()){
        const msg = new Paho.MQTT.Message(JSON.stringify({type:'action', t:Date.now()}));
        msg.destinationName = TOPIC_ACT;
        try{ client.send(msg); }catch(e){}
      }
    });
  </script>
</body>
</html>
