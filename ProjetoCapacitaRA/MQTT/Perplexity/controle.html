<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Controlador Virtual</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {background: #121b2b; color:#fff; font-family:sans-serif; display: flex; height:100vh; align-items:center; justify-content:center;}
    .painel {background: rgba(30,36,48,0.85); padding:28px; border-radius:18px; box-shadow:0 6px 24px #000a;}
    h2 {color: #64f4ac; font-family:'Orbitron',sans-serif;}
    #status {margin:12px 0; color:#8fffc2;}
    #rotação {font-size:1.1em; margin:8px 0;}
    .botaoAção {padding:16px 32px; background:#222c4f; color:#8fffc2;border:1px solid #31d2b0; border-radius:12px; cursor:pointer; transition:all 0.2s;}
    .botaoAção:hover {background:#31d2b0;color:#222c4f;}
  </style>
  <link href="https://fonts.googleapis.com/css?family=Orbitron:700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="painel">
    <h2>Controlador Virtual</h2>
    <div id="status">Conectando ao MQTT...</div>
    <div id="rotação">Alpha: 0 | Beta: 0 | Gamma: 0</div>
    <button class="botaoAção" onclick="enviarAcao()">Executar Ação no Avião</button>
  </div>
  <!-- Biblioteca Paho MQTT -->
  <script src="https://unpkg.com/paho-mqtt/mqttws31.min.js"></script>
  <script>
    // Setup MQTT
    const clientID = "controle-" + Math.random().toString(16).substr(2, 8);
    const client = new Paho.MQTT.Client("test.mosquitto.org", 8081, clientID);

    client.onConnectionLost = () => {
      document.getElementById('status').textContent = 'Desconectado do MQTT!';
    };

    client.connect({
      onSuccess: () => {
        document.getElementById('status').textContent = 'Conectado ao MQTT!';
      }
    });

    // Envia rotação continuamente
    function enviarRotacao(alpha, beta, gamma) {
      const dados = {
        tipo: 'rotacao',
        alpha,
        beta,
        gamma
      };
      client.send("projetoAR/controle", JSON.stringify(dados));
    }

    // Captura rotação do dispositivo
    window.addEventListener('deviceorientation', function(event) {
      document.getElementById('rotação').textContent =
        `Alpha: ${event.alpha?.toFixed(1)} | Beta: ${event.beta?.toFixed(1)} | Gamma: ${event.gamma?.toFixed(1)}`;
      if (client.isConnected())
        enviarRotacao(event.alpha, event.beta, event.gamma);
    });

    // Envia ação via MQTT
    function enviarAcao() {
      if(client.isConnected()) {
        client.send("projetoAR/controle", JSON.stringify({
          tipo: 'acao',
          acao: 'animar'
        }));
      }
    }

    // Comentários:
    // - O controle envia rotação e ação pelo tópico "projetoAR/controle" do MQTT.
    // - Use qualquer broker MQTT público; aqui utiliza test.mosquitto.org.
    // - Para modificar o broker, altere o endereço e porta na instância do Paho MQTT.
  </script>
</body>
</html>
