<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Controlador Virtual MQTT</title>
    <!-- Biblioteca Paho MQTT para conexão via WebSockets -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
        
        body {
            font-family: 'Orbitron', sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #111;
            color: white;
            overflow: hidden;
            user-select: none;
        }

        .status {
            position: absolute;
            top: 20px;
            padding: 10px 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            font-size: 0.9rem;
            color: #00ffcc;
            border: 1px solid #00ffcc;
        }

        #connectButton {
            padding: 20px 40px;
            font-size: 1.2rem;
            background: transparent;
            color: #00ffcc;
            border: 2px solid #00ffcc;
            border-radius: 10px;
            font-family: inherit;
            cursor: pointer;
            transition: 0.3s;
        }
        
        #connectButton:hover {
            background: #00ffcc;
            color: #000;
            box-shadow: 0 0 20px #00ffcc;
        }

        #actionButton {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: radial-gradient(circle, #ff004c 0%, #800026 100%);
            border: 4px solid #ff4d82;
            color: white;
            font-size: 1.5rem;
            font-family: inherit;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 0 30px #ff004c;
            display: none; /* Oculto até conectar */
            transition: transform 0.1s;
        }
        
        #actionButton:active {
            transform: scale(0.95);
            box-shadow: 0 0 50px #ff004c;
            background: #ff004c;
        }

        .info {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #666;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="status" class="status">Desconectado</div>
    <button id="connectButton">INICIAR SISTEMA</button>
    <button id="actionButton">DISPARAR</button>
    <div class="info">Broker: broker.hivemq.com (Público)</div>

    <script>
        // --- CONFIGURAÇÃO MQTT ---
        // Usamos um broker público gratuito via WebSockets
        const BROKER = "broker.hivemq.com";
        const PORT = 8000; // Porta WebSocket padrão do HiveMQ
        // Tópico único para evitar interferência de outros usuários no broker público
        const TOPIC = "projetoAR/controle/dados_v1"; 
        
        let client;
        let isConnected = false;
        let lastSendTime = 0;

        const statusEl = document.getElementById('status');
        const connectBtn = document.getElementById('connectButton');
        const actionBtn = document.getElementById('actionButton');

        // --- LÓGICA DE CONEXÃO MQTT ---
        function connectMQTT() {
            statusEl.innerText = "Conectando ao Broker...";
            
            // ID do cliente aleatório
            const clientId = "webxr_ctrl_" + Math.random().toString(16).substr(2, 8);
            client = new Paho.MQTT.Client(BROKER, PORT, clientId);

            client.onConnectionLost = onConnectionLost;

            // Conecta
            client.connect({
                onSuccess: onConnect,
                onFailure: onFailure,
                useSSL: false // HiveMQ na porta 8000 geralmente é não-SSL (use true/8884 se necessário)
            });
        }

        function onConnect() {
            console.log("MQTT Conectado!");
            statusEl.innerText = "Online | Calibrado";
            isConnected = true;
            
            // Troca botões
            connectBtn.style.display = 'none';
            actionBtn.style.display = 'block';

            // Inicia sensores
            requestOrientationPermission();
        }

        function onFailure(message) {
            console.log("Falha na conexão: " + message.errorMessage);
            statusEl.innerText = "Erro ao conectar";
        }

        function onConnectionLost(responseObject) {
            if (responseObject.errorCode !== 0) {
                console.log("Conexão perdida: " + responseObject.errorMessage);
                statusEl.innerText = "Desconectado";
                isConnected = false;
                connectBtn.style.display = 'block';
                actionBtn.style.display = 'none';
            }
        }

        // --- ENVIO DE DADOS ---
        function sendData(type, payload) {
            if (!isConnected) return;

            const messageData = JSON.stringify({
                type: type,
                payload: payload
            });

            const message = new Paho.MQTT.Message(messageData);
            message.destinationName = TOPIC;
            client.send(message);
        }

        // --- SENSORES DO DISPOSITIVO ---
        function requestOrientationPermission() {
            // iOS 13+ requer permissão explícita
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(response => {
                        if (response === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation);
                        } else {
                            alert("Permissão negada para sensores.");
                        }
                    })
                    .catch(console.error);
            } else {
                // Android e outros
                window.addEventListener('deviceorientation', handleOrientation);
            }
        }

        function handleOrientation(event) {
            // Limita a taxa de envio para não sobrecarregar (throttle ~50ms)
            const now = Date.now();
            if (now - lastSendTime < 50) return;
            lastSendTime = now;

            // Captura rotações
            // Alpha: Rotação em Z (Bússola) 0-360
            // Beta: Rotação em X (Frente/Trás) -180 a 180
            // Gamma: Rotação em Y (Esquerda/Direita) -90 a 90
            const data = {
                alpha: event.alpha || 0,
                beta: event.beta || 0,
                gamma: event.gamma || 0
            };

            sendData('rotate', data);
        }

        // --- EVENTOS DE INTERFACE ---
        connectBtn.addEventListener('click', connectMQTT);

        actionBtn.addEventListener('click', () => {
            // Envia sinal de ação
            sendData('action', { timestamp: Date.now() });
            
            // Feedback visual no botão
            navigator.vibrate?.(50); // Vibra se suportado
        });

    </script>
</body>
</html>
