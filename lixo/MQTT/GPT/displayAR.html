<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Display AR</title>
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.min.js"></script>
  <!-- Cliente MQTT para navegador via WebSockets (Paho) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.1.0/paho-mqtt.min.js" integrity="sha512-dwqv8+1S9m0b3fQHqQ2d4oKG4kFMZJkz6NUI0YF0t4X6H+y9qH7dO0eWZKqPpV1s+0m7z1sZsFKR6tKpQK2yVw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <style>
    body{margin:0;overflow:hidden}
    .hud{position:fixed;inset:12px auto auto 12px;z-index:10;color:#e6eefb;background:rgba(0,0,0,.35);backdrop-filter:blur(6px);border-radius:10px;padding:8px 10px;font:500 12px/1.2 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    .hud b{color:#00e5ff}
  </style>
</head>
<body>
  <div class="hud">
    <div>MQTT: <b id="mqttState">conectando…</b></div>
    <div>Rotação alvo: <span id="dbgRot">0,0,0</span></div>
  </div>

  <!-- Cena AR com marcador "hiro" -->
  <a-scene vr-mode-ui="enabled:false" renderer="antialias:true; colorManagement:true; physicallyCorrectLights:true; logarithmicDepthBuffer:true" embedded arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false">
    <!-- Onde alterar o modelo 3D: troque o src abaixo para outro .glb/.gltf local -->
    <a-assets>
      <a-asset-item id="planeModel" src="./aviao_low_poly.glb" crossorigin="anonymous"></a-asset-item>
    </a-assets>

    <a-entity light="type: hemisphere; color: #ffffff; groundColor: #666666; intensity: 1.0" position="0 2 0"></a-entity>
    <a-entity light="type: directional; intensity: 0.6" position="1 2 0"></a-entity>

    <a-marker preset="hiro">
      <a-entity id="plane" gltf-model="#planeModel" position="0 0 0" rotation="0 0 0" scale="0.6 0.6 0.6" animation-mixer="clip: *; loop: once; timeScale: 0; clampWhenFinished: true"></a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // ====================================================
    // Recebe dados via MQTT e aplica no modelo 3D
    // ====================================================
    // Como o display recebe e aplica as rotações:
    // - Conecta ao mesmo broker MQTT via WebSockets
    // - Mensagens em webxr/ar/plane1/orientation: {alpha,beta,gamma}
    // - Mapeia alpha->y, beta->x, gamma->z e suaviza a transição
    const MQTT_URL = 'wss://test.mosquitto.org:8081/mqtt';
    const TOPIC_ORI = 'webxr/ar/plane1/orientation';
    const TOPIC_ACT = 'webxr/ar/plane1/action';

    const clientId = 'disp-' + Math.random().toString(16).slice(2);
    const client = new Paho.MQTT.Client(MQTT_URL, clientId);

    const stateEl = document.getElementById('mqttState');
    const dbgRot = document.getElementById('dbgRot');
    const planeEl = document.getElementById('plane');

    client.onConnectionLost = () => { stateEl.textContent = 'desconectado'; tryReconnect(); };
    client.onMessageArrived = (m)=>{
      try{
        const data = JSON.parse(m.payloadString);
        if(m.destinationName === TOPIC_ORI && data){
          targetRot = { x: data.beta||0, y: data.alpha||0, z: data.gamma||0 };
          haveTarget = true;
          dbgRot.textContent = `${targetRot.x.toFixed(0)}, ${targetRot.y.toFixed(0)}, ${targetRot.z.toFixed(0)}`;
        } else if(m.destinationName === TOPIC_ACT) {
          triggerModelAction();
        }
      }catch(e){}
    };

    function connect(){
      client.connect({
        timeout: 4,
        keepAliveInterval: 30,
        cleanSession: true,
        reconnect: true,
        onSuccess: ()=>{ stateEl.textContent = 'conectado'; client.subscribe(TOPIC_ORI); client.subscribe(TOPIC_ACT); },
        onFailure: ()=>{ stateEl.textContent = 'falha'; setTimeout(tryReconnect, 1000); }
      });
    }
    function tryReconnect(){ try{ connect(); }catch(e){} }
    connect();

    let targetRot = { x:0, y:0, z:0 }, haveTarget = false;
    function smooth(){
      if(haveTarget && planeEl && planeEl.object3D){
        const cur = planeEl.getAttribute('rotation');
        const k = 0.25;
        planeEl.setAttribute('rotation', { x: cur.x + (targetRot.x - cur.x)*k, y: cur.y + (targetRot.y - cur.y)*k, z: cur.z + (targetRot.z - cur.z)*k });
      }
      requestAnimationFrame(smooth);
    }
    requestAnimationFrame(smooth);

    function triggerModelAction(){
      try{ planeEl.removeAttribute('animation-mixer'); setTimeout(()=>{ planeEl.setAttribute('animation-mixer','clip: *; loop: once; timeScale: 1; clampWhenFinished: true'); },0); }catch(e){}
      planeEl.setAttribute('animation__pulse','property: scale; to: 0.7 0.7 0.7; dir: alternate; dur: 180; loop: 2; easing: easeInOutSine');
      setTimeout(()=> planeEl.removeAttribute('animation__pulse'), 600);
    }
  </script>
</body>
</html>
