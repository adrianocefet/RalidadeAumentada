<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sistema de Realidade Aumentada</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root { --bg1:#0f0c29; --bg2:#302b63; --bg3:#24243e; --accent:#00e5ff; --accent2:#7c4dff; --text:#e9eefb; }
    *{box-sizing:border-box} html,body{height:100%}
    body{margin:0;font-family:"Poppins",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--text);
      background:linear-gradient(120deg,var(--bg1),var(--bg2),var(--bg3));background-size:180% 180%;
      animation:shift 12s ease infinite;display:grid;place-items:center}
    @keyframes shift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
    .wrap{width:min(100%,900px);padding:32px;text-align:center}
    h1{margin:0 0 8px;font-size:clamp(1.6rem,4vw,2.6rem)}
    p.lead{margin:0 0 28px;color:#cbd5e1}
    .panel{margin:auto;padding:28px;background:rgba(255,255,255,.04);backdrop-filter:blur(8px);
      border:1px solid rgba(255,255,255,.08);border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,.35),inset 0 0 30px rgba(124,77,255,.12)}
    .actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin-top:16px}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px 20px;border-radius:14px;
      background:radial-gradient(120% 120% at 50% 0%,rgba(0,229,255,.24),rgba(124,77,255,.12) 40%,rgba(255,255,255,.04) 70%);
      border:1px solid rgba(0,229,255,.45);color:var(--text);text-decoration:none;font-weight:600;letter-spacing:.4px;
      transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;box-shadow:0 10px 24px rgba(0,229,255,.18),inset 0 0 24px rgba(0,229,255,.12)}
    .btn.secondary{border-color:rgba(124,77,255,.55);box-shadow:0 10px 24px rgba(124,77,255,.18),inset 0 0 24px rgba(124,77,255,.14);
      background:radial-gradient(120% 120% at 50% 0%,rgba(124,77,255,.26),rgba(0,229,255,.10) 40%,rgba(255,255,255,.03) 70%)}
    .btn:hover{transform:translateY(-3px);box-shadow:0 16px 40px rgba(0,229,255,.28),0 0 30px rgba(0,229,255,.22) inset;border-color:var(--accent)}
    .btn.secondary:hover{box-shadow:0 16px 40px rgba(124,77,255,.28),0 0 30px rgba(124,77,255,.22) inset;border-color:var(--accent2)}
    .hint{margin-top:20px;font-size:.9rem;color:#9fb2d1}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="panel">
      <h1>Sistema de Realidade Aumentada</h1>
      <p class="lead">Escolha um módulo para iniciar</p>
      <div class="actions">
        <a class="btn" href="displayAR.html">Display AR</a>
        <a class="btn secondary" href="controle.html">Controlador Virtual</a>
      </div>
      <p class="hint">Sugestão: abra o Display no computador com câmera e o Controlador no smartphone.</p>
    </div>
  </main>
</body>
</html>
